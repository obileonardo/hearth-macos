name: Build

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'scripts/**'
      - 'WidgetExtension/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/licenses/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS / Swift release build
    # Xcode 26 SDK coverage on a stable supported host. Required check and
    # complete regression suite are unchanged; do not bypass queued checks.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
      - name: Build executable
        run: swift build --configuration release
      - name: Run isolated regressions
        run: swift test
      - name: Verify optional maintenance patches with synthetic fixtures
        run: python3 -m unittest discover -s Tests/MaintenancePatches -v
      - name: Verify appearance contrast
        run: python3 scripts/contrast.py --verify-source
      - name: Check release scripts
        run: scripts/check-shell-syntax.sh
      - name: Verify release tooling with isolated fixtures
        run: python3 scripts/verify-release-tools.py
      - name: Compile optional widget extension
        run: scripts/build-widgets.sh --universal

# Compiles source only. No app launch, Home Assistant session, signing secrets,
# installation, uploads, or public binary release is part of this workflow.
